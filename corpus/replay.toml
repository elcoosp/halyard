version = 1

# Time-machine replay corpus (M2.7, docs/HALYARD_ARCHITECTURE.md §17).
#
# Each row replays release tags of one pinned corpus clone: for every tag T
# the planner runs in-process against the repository state at T~1 and the
# planned `to` version is compared with the version parsed from the tag
# name. `conventional` records whether the repo manages releases through
# conventional commits (the §17 >= 95 % agreement gate applies to those
# repos; non-conventional repos are reported for triage only).
#
# Tags are the last 12 plain semver release tags of each clone
# (`git tag --list` filtered to ^v?X.Y.Z$, sorted by version).

[[repo]]
path = "corpus/clones/fd"
ecosystem = "cargo"
# Measured triage (docs/replay.md, M2.7 run): every disagreement window is
# dominated by non-conventional subjects (fd-SEEK/main/hand-rolled subjects,
# e.g. 32 of 57 at v9.0.0, 461 of 474-class windows in bat); fd releases are
# hand-bumped, so the repo is triage-only, not gate-scoped.
conventional = false
releases = [
  "v8.7.1",
  "v9.0.0",
  "v10.0.0",
  "v10.1.0",
  "v10.2.0",
  "v10.3.0",
  "v10.4.0",
  "v10.4.1",
  "v10.4.2",
  "v10.5.0",
  "v10.5.1",
  "v10.5.2",
]

