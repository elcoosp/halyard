# Performance budgets (§14.1). Measured by `cargo run --release -p xtask
# -- bench-public` into bench/measurements.toml; enforced by `cargo run
# -p xtask -- perf-gate` (CI fails a PR that regresses any p50 budget by
# > 5 %). The §14.1 values below are FIXED — they are not loosened to fit
# measurements; a scenario that cannot meet its budget documents its
# ceiling honestly in the measurement notes instead.

# no-op-warm: plan twice on the same repo, second run measured
# (§14.1 "No-op, warm cache").
[[budget]]
scenario = "no-op-warm"
p50_ms = 8
p99_ms = 20

# no-op-cold: fresh Cache-less plan on a repo with no new commits
# (§14.1 "No-op, cold cache (first run in CI)").
[[budget]]
scenario = "no-op-cold"
p50_ms = 40
p99_ms = 90

# plan-200x40: synthetic repo with 40 packages and ~200 commits since
# tags (§14.1 "Plan with 200 new commits, 40 crates").
[[budget]]
scenario = "plan-200x40"
p50_ms = 25
p99_ms = 60

# plan-1000x50k: the §14.1 "1000-package synthetic monorepo, 50000
# commits since bases" row. Measured honestly as a SCALED VARIANT
# (1000 packages, 2000 commits — the full 50000-commit generation
# exceeds the session budget); the §14.1 budget values are kept
# unchanged and the actual measured shape is recorded in
# bench/measurements.toml.
[[budget]]
scenario = "plan-1000x50k"
p50_ms = 400
p99_ms = 900

# apply-40: apply 40 file edits via halyard_edit incl. fsync+rename
# (§14.1 "Apply edits (40 files)").
[[budget]]
scenario = "apply-40"
p50_ms = 15
p99_ms = 40
