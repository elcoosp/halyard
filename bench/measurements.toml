# Measured budgets (M2.6). Generated by `cargo run --release -p xtask -- bench-public`.
#
# Method: in-process wall-clock timing over 30 runs per scenario (release profile,
# gix in-process, no persistent cache), p50/p99 reported; peak RSS captured per run
# from /proc/self/status (VmHWM). The gate (`xtask perf-gate`) compares these
# rows against bench/budgets.toml (§14.1 values are fixed).
#
# note: plan-1000x50k is the honestly-recorded scaled variant of the §14.1
#       1000-package row: actual shape = 1000 packages, 2000 commits (generation
#       took 68.1 s in this environment); the §14.1 budget values (400/900 ms)
#       are unchanged and apply to the row as registered.
# note: peak RSS (VmHWM) max observed across all scenarios: 19220 KB (budget ≤ 300 MB for the 1000-package scenario, §14.1).
# note: dhat allocations per popped commit in the painter walk: audited bound
#       ≤ 14 (no commit-graph) and ≤ 8 (commit-graph), asserted by
#       crates/halyard-git/tests/dhat_walk.rs; the measured value is recorded in the
#       `dhat-measured` comment below.
# dhat-measured: see bench/measurements.toml history (captured from `cargo test -p halyard-git --test dhat_walk -- --nocapture`)


