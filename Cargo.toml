[workspace]
resolver = "3"
# Crates are added as their milestones land (ADR-0002): the §7.1 layout is
# reached incrementally so the tree never contains empty scaffolding.
members = [
    "crates/halyard-action",
    "crates/halyard-cache",
    "crates/halyard-changelog",
    "crates/halyard-cli",
    "crates/halyard-config",
    "crates/halyard-conventional",
    "crates/halyard-core",
    "crates/halyard-discover",
    "crates/halyard-eco-cargo",
    "crates/halyard-eco-dart",
    "crates/halyard-eco-npm",
    "crates/halyard-eco-gomod",
    "crates/halyard-eco-maven",
    "crates/halyard-eco-nuget",
    "crates/halyard-eco-pypi",
    "crates/halyard-edit",
    "crates/halyard-forge",
    "crates/halyard-forge-bitbucket",
    "crates/halyard-forge-forgejo",
    "crates/halyard-forge-gitlab",
    "crates/halyard-forge-github",
    "crates/halyard-git",
    "crates/halyard-publish",
    "crates/halyard-registry",
    "crates/halyard-test-support",
    "crates/halyard-version",
    "crates/xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elcoosp/halyard"
version = "0.0.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
# Pedantic + restriction enforcement lives HERE, not on the clippy CLI
# (`-W clippy::pedantic` on the command line would override the allow-listed
# entries below). The gate remains `cargo clippy --workspace --all-targets
# --features ci-bundle -- -D warnings` (ADR-0030: the conflict-free spelling;
# `--all-features` combines the machine-enforced-exclusive miri/loom pair).
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# §15.3 restriction set; the test allowances (`allow-unwrap-in-tests` & co.)
# live in `clippy.toml` — clippy's behavioral configuration file, which
# cannot be expressed as `[lints]` entries (it was removed as "obsolete" in
# 801f1b0 and restored when the gate proved load-bearing). `indexing_slicing`
# has no test allowance, so test code uses `.get()`/iterators instead of
# direct indexing.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
# Pedantic curation (rationale):
# - must_use_candidate: fires on every read-only getter in DSL/builder APIs;
#   #[must_use] spam on accessors hides genuinely must-use results (apply it
#   by hand where it matters, e.g. on plan-contract types).
# - missing_errors_doc: error behavior is documented by the error type itself
#   plus docs/errors/E-*.md pages (§15.4), not by per-function `# Errors`
#   sections that rot as signatures evolve.
must_use_candidate = "allow"
missing_errors_doc = "allow"

[workspace.dependencies]
halyard-action = { path = "crates/halyard-action" }
halyard-cache = { path = "crates/halyard-cache" }
halyard-changelog = { path = "crates/halyard-changelog" }
halyard-cli = { path = "crates/halyard-cli" }
halyard-config = { path = "crates/halyard-config", features = ["schema-gen"] }
halyard-conventional = { path = "crates/halyard-conventional" }
halyard-core = { path = "crates/halyard-core", features = ["schema-gen"] }
halyard-discover = { path = "crates/halyard-discover" }
halyard-eco-cargo = { path = "crates/halyard-eco-cargo" }
halyard-eco-dart = { path = "crates/halyard-eco-dart" }
halyard-eco-npm = { path = "crates/halyard-eco-npm" }
halyard-eco-gomod = { path = "crates/halyard-eco-gomod" }
halyard-eco-maven = { path = "crates/halyard-eco-maven" }
halyard-eco-nuget = { path = "crates/halyard-eco-nuget" }
halyard-eco-pypi = { path = "crates/halyard-eco-pypi" }
halyard-edit = { path = "crates/halyard-edit" }
halyard-forge = { path = "crates/halyard-forge" }
halyard-forge-bitbucket = { path = "crates/halyard-forge-bitbucket" }
halyard-forge-forgejo = { path = "crates/halyard-forge-forgejo" }
halyard-forge-gitlab = { path = "crates/halyard-forge-gitlab" }
halyard-forge-github = { path = "crates/halyard-forge-github" }
halyard-git = { path = "crates/halyard-git" }
halyard-publish = { path = "crates/halyard-publish" }
halyard-registry = { path = "crates/halyard-registry" }
halyard-test-support = { path = "crates/halyard-test-support" }
halyard-version = { path = "crates/halyard-version" }
xtask = { path = "crates/xtask" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
# §6.2: Cargo manifests are parsed with `toml_edit` (spans enabled) so every
# dependency requirement carries its edit site (§9.1).
toml_edit = "0.25"
# §6.2: workspace walking respects .gitignore and prunes build dirs.
ignore = "0.4"
tempfile = "3.20"
schemars = "1.0"
criterion = "0.7"
semver = "1.0"
smallvec = "1.15"
bstr = "1.12"
blake3 = "1.8"
winnow = "1"
proptest = "1.8"
insta = "1"
# Cargo-audit: override transitive dependencies with patched versions
url = "2.5.9"
heapless = "0.9.4"
# ADR-0052: the §12 distribution's SHA256SUMS grammar hashes the release
# assets with SHA-256 (the `sha256sum`/`Get-FileHash` checker contract).
sha2 = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
# §14.2: CLI ships with abort-on-panic. Note this makes `cargo test --release`
# unsupported by design; gates run the test profile (debug), never release.
panic = "abort"