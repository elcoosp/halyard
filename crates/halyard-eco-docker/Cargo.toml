[package]
name = "halyard-eco-docker"
description = "EcosystemAdapter for Docker image tags: Dockerfile discovery, OCI version-label strategy, Dockerfile edits (M8)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
halyard-core = { workspace = true }
# Version parsing (the same crate core uses; §7.2 adapters carry no
# workspace deps beyond core).
semver = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "docker_scan"
harness = false

# ADR-0063 M2: the semantic edit seam rides the workspace gate battery.
[[bench]]
name = "docker_edit"
harness = false

[lints]
workspace = true
