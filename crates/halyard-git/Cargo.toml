[package]
name = "halyard-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "gix-based history engine: ref enumeration, base resolution and the painter walk (M2.1/M2.2)"

[dependencies]
halyard-core = { workspace = true }
# ADR-0009: the walk emits parsed commits (§5.7); the parser is a
# zero-dependency leaf, so the layer edge stays cycle-free.
halyard-conventional = { workspace = true }
# §8.1: gix with minimal features. The architecture doc's
# `max-performance-safe` feature no longer exists in gix 0.90 (drift
# noted in the PR body); the minimal functional set for in-process
# object/pack access is `sha1` — no network client, no index, no
# worktree machinery.
gix = { version = "0.90", default-features = false, features = ["sha1"] }
# The commit-graph reader type `gix_commitgraph::Graph` is an
# unconditional dependency of `gix` already; named here for the
# `Generations` cache.
gix-commitgraph = "0.42"
semver = { workspace = true }

[dev-dependencies]
halyard-test-support = { workspace = true }
insta = { workspace = true }
dhat = "0.3"
criterion = { workspace = true }

[[bench]]
name = "walk"
harness = false

[lints]
workspace = true
