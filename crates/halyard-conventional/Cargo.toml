[package]
name = "halyard-conventional"
description = "Spec-compliant conventional-commit parser: types, scopes, footers, trailers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# §7.1: hand-written zero-alloc parser over bytes; `bstr` owns the emitted
# fields (subject/body bytes borrowed during parsing, copied on emit).
winnow = { workspace = true }
bstr = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
insta = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "parse"
harness = false

# §11.6 (M4.3 `check`): the PR-title lint seam shares the parser bench
# profile (one lint per `check` invocation, cold path).
[[bench]]
name = "title_lint"
harness = false

[lints]
workspace = true
