[package]
name = "halyard-config"
description = "halyard.toml configuration model, layered resolution, JSON schema and the `init` scaffold engine (ADR-0029)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
# M1.8 loader: TOML parsing plus canonical-JSON hashing through the pure
# core (`check-layers` allow-lists both edges).
toml = { workspace = true }
serde_json = { workspace = true }
halyard-core = { workspace = true }

# Schema generation for the checked-in `halyard.toml` JSON schema (`M0.7`);
# feature-gated like `halyard-core` so default builds stay lean.
schemars = { workspace = true, optional = true }

[features]
default = []
schema-gen = ["dep:schemars"]
# The CI gate feature (ADR-0030): `--features ci-bundle` is the
# conflict-free spelling of "all stable features" for workspace-wide
# gate runs — every feature-carrying crate contributes its stable
# features here and keeps its manual/nightly lanes (e.g. the cache
# crate's `miri`/`loom`, documented-exclusive) out of the bundle.
ci-bundle = ["schema-gen"]

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
# M4.7 step 1 (`migrate`): the survey bench rides the workspace criterion.
criterion = { workspace = true }

[[bench]]
name = "migrate"
harness = false

[[bench]]
name = "channel"
harness = false

# ADR-0029 (`init`): the scaffold planner + its write step.
[[bench]]
name = "init"
harness = false

[lints]
workspace = true
