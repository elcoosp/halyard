[package]
name = "halyard-eco-pypi"
description = "EcosystemAdapter for PyPI/uv: PEP 621 discovery, PEP 440 strategy, byte-preserving pyproject edits (M8 step 1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
halyard-core = { workspace = true }
# §6.2: span-preserving TOML parsing — the same sanctioned parser the
# cargo adapter uses for `Cargo.toml` (invariant I6).
toml_edit = { workspace = true }
# Version/requirement grammar (the same crate core uses; §7.2 adapters
# carry no workspace deps beyond core).
semver = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
insta = { workspace = true }
criterion = { workspace = true }
halyard-test-support = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "pyproject_scan"
harness = false

[[bench]]
name = "publish_args"
harness = false

[[bench]]
name = "uvlock_verify"
harness = false

[lints]
workspace = true
