[package]
name = "halyard-eco-maven"
description = "EcosystemAdapter for Maven/Gradle: pom.xml and build.gradle(.kts) discovery, parent inheritance, semver-canonical versions (M8)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
halyard-core = { workspace = true }
# Version parsing (the same crate core uses; §7.2 adapters carry no
# workspace deps beyond core).
semver = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "pom_scan"
harness = false

[[bench]]
name = "pom_edit"
harness = false

# ADR-0058 continued (M1): the Gradle build-file discovery slice's scan
# bench (the hand-rolled literal-assignment lexer over a build script).
[[bench]]
name = "gradle_scan"
harness = false

# ADR-0058 continued (M2): the Gradle build-file semantic edit seam's
# bench (the re-scan + span-match + splice + read-back verify).
[[bench]]
name = "gradle_edit"
harness = false

[lints]
workspace = true
