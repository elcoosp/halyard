[package]
name = "halyard-action"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The §12 action-output seam (ADR-0037 + ADR-0043) and the §12 composite distribution's grammar (ADR-0052): the §12 GitHub Actions outputs vocabulary over the GITHUB_OUTPUT/GITHUB_STEP_SUMMARY env files — the writer seam (real + preview), the plan forecast renderer, the §12 pr mode's pass renderers, the §12 check mode's verdict, the canonical plan-file write, and the release-asset/checksum/input contract the composite action and the release pipeline both pin"

[dependencies]
# The §12 outputs vocabulary renders from the plan wire contract (§5.8):
# releases, tags, edits — the plan types are the whole dependency.
halyard-core = { workspace = true }
serde_json = { workspace = true }
# ADR-0052: the distribution grammar's SHA256SUMS half hashes release
# assets with SHA-256 (the checksum checkers' own digest).
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "render"
harness = false

[[bench]]
name = "distribution"
harness = false

[lints]
workspace = true
