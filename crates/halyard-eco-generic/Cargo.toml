[package]
name = "halyard-eco-generic"
description = "EcosystemAdapter for the `generic` ecosystem: config-declared packages over regex-edited version files (M8, ADR-0062)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
halyard-core = { workspace = true }
# Version parsing (the same crate core uses; §7.2 adapters carry no
# workspace deps beyond core).
semver = { workspace = true }
# ADR-0062: the locator grammar — the user-declared pattern compiles
# under the `regex` crate (the VERIFIED named-group semantics in
# docs/research/generic-version-files.md §2).
regex = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "generic_scan"
harness = false

# ADR-0062 M2: the semantic edit seam rides the workspace gate battery.
[[bench]]
name = "generic_edit"
harness = false

[lints]
workspace = true
