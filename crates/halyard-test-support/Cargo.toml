[package]
name = "halyard-test-support"
description = "Git fixture builder DSL, mock helpers and golden-test support for HALYARD"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tempfile = { workspace = true }
# Differential-test comparator: parses `cargo metadata --no-deps` JSON
# (M1.5). Test-support only; never a runtime dependency.
serde_json = { workspace = true }
halyard-core = { workspace = true }
# §7.1: the mock forge is surfaced here as a re-export — the [`Forge`]
# trait and its reference adapter are defined in `halyard-forge`;
# test-support is the fixture-facing home E2E suites import from.
halyard-forge = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "fixture_build"
harness = false

[lints]
workspace = true
