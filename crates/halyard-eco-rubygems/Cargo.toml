[package]
name = "halyard-eco-rubygems"
description = "EcosystemAdapter for RubyGems: .gemspec discovery, Gem::Version strategy, gemspec edits (M8)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
halyard-core = { workspace = true }
# Version parsing (the same crate core uses; §7.2 adapters carry no
# workspace deps beyond core).
semver = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "gemspec_scan"
harness = false

[[bench]]
name = "gemspec_edit"
harness = false

[lints]
workspace = true
