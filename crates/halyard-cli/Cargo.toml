[package]
name = "halyard-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The `halyard` command line: plan, apply, pr, check, explain, status, graph, doctor, schema, completions"

[[bin]]
name = "halyard"
path = "src/main.rs"

[dependencies]
halyard-config = { workspace = true }
halyard-core = { workspace = true }
halyard-discover = { workspace = true }
halyard-edit = { workspace = true }
# M3.2: the CLI shell orchestrates the native lockfile fallback
# (`refresh_lockfile_native` + `verify_native_refresh`, §9.2 rule 4) and
# calls the verifier from the adapter crate that owns the lockfile
# grammar.
halyard-eco-cargo = { workspace = true }
# M3.4: the CLI shell orchestrates the pnpm native lockfile fallback and
# calls the pnpm verifier from the adapter crate that owns the grammar.
halyard-eco-npm = { workspace = true }
halyard-git = { workspace = true }
# M2.6 close-out (§8.7): the planning pipeline opens the persistent
# per-commit cache and hands it to `GitHistory::build_with_options`;
# `--no-cache` skips it and a cache that cannot open degrades to an
# uncached run (§8.7: the cache is an optimization, never a failure).
halyard-cache = { workspace = true }
# M4.2b step 1 (`pr --dry`): the shell drives the §11.1 machine over the
# dry-run adapter (halyard-forge) and renders the §11.3 body through the
# changelog renderer.
halyard-forge = { workspace = true }
halyard-changelog = { workspace = true }
# M4.3 `check` (§11.6): the title-lint seam — the engine lives in the
# parser leaf (policy injected via `TitleBumpRule`), the CLI binds the
# resolved `PlanConfig` mapping and renders the verdicts.
halyard-conventional = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }

[dev-dependencies]
halyard-test-support = { workspace = true }
insta = { workspace = true }

[lints]
workspace = true
