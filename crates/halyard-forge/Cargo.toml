[package]
name = "halyard-forge"
description = "The Forge seam (§11.4, M4.1a): the forge-agnostic Release-PR/release trait, its data vocabulary and the deterministic MemoryForge reference adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# §7.2: `forge` depends on core only. The seam is plain data plus the
# trait — the effectful HTTP lives in future forge adapters (M4.1b).
halyard-core = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# The release_machine example renders its PrSpec body through the §11.3
# renderer (the real producer/consumer composition) — a dev-dep, so the
# §7.2 layer rule (`forge → core` only) holds for the runtime graph.
halyard-changelog = { workspace = true }

[[bench]]
name = "memory_forge"
harness = false

[[bench]]
name = "state_machine"
harness = false

# M4.2b step 1 (`pr --dry`): the dry-run pass shapes over PreviewForge.
[[bench]]
name = "pr_preview"
harness = false

# M5.5: the §11.5 call governor — decorator overhead on the update path,
# the pacing decision, the budget ledger.
[[bench]]
name = "governor"
harness = false

# M4.5 step 1: the §11.6 check-comment path — the render the shell feeds
# the seam, the create and marker-rewrite upsert shapes.
[[bench]]
name = "pr_comment"
harness = false

[lints]
workspace = true
