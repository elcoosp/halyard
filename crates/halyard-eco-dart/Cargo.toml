[package]
name = "halyard-eco-dart"
description = "EcosystemAdapter for Dart/pub: pubspec.yaml discovery, pub workspaces, semver-canonical versions (M8)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
halyard-core = { workspace = true }
# Version parsing (the same crate core uses; §7.2 adapters carry no
# workspace deps beyond core).
semver = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "pubspec_scan"
harness = false

[[bench]]
name = "pubspec_edit"
harness = false

[lints]
workspace = true
